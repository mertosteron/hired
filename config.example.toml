# Copy to config.toml and fill in your details.
# config.toml is auto-loaded from the working directory at startup.

default_subject = "Application — [Your Name]"
default_body = """Hello,

I came across your company and would love to be considered for any open
engineering roles. My CV is attached.

Best regards,
[Your Name]
"""
cv_path = "cv.pdf"

# Optional second attachment (e.g. transcript). Leave empty or remove to skip.
transcript_path = ""

# Random delay between emails in seconds (spam protection).
# Actual delay per email is chosen uniformly in [min, max].
# Defaults: 60–240 seconds (1–4 minutes).
send_delay_min_secs = 60
send_delay_max_secs = 240

# Maximum emails sent per session (daily guard). Default: 50.
daily_limit = 50

# Only send emails between these hours, 0–23. Default: 8:00–22:00.
send_window_start = 8
send_window_end = 22

# IANA timezone for the send window. "Local" uses system clock.
# Examples: "Europe/Istanbul", "America/New_York", "UTC"
timezone = "Local"

# ---------- Gmail-draft scheduler (used by `scheduler` binary + TUI [Ctrl+E]) ----------
#
# Drafts are created in Gmail with [Ctrl+E] inside the TUI, then sent by the
# scheduler binary at the times below. Bot can be closed; scheduler keeps
# running under systemd / launchd / Windows Task Scheduler.

[schedule]
window_start = "09:30"     # daily send window opens (HH:MM, local tz)
window_end   = "17:00"     # daily send window closes
days         = ["Mon", "Tue", "Wed", "Thu", "Fri"]
interval_min = 45          # minutes between two consecutive sends
daily_limit  = 15          # hard cap per calendar day
timezone     = "Local"     # IANA name or "Local"

[gmail]
# client_id / client_secret are read from .env (GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET)
# — never put them here.
token_cache = "token_cache.json"
drafts_db   = "drafts.json"
sent_log    = "sent_log.json"
failed_log  = "failed_log.json"

[smtp]
# Gmail example. Use an App Password, not your normal account password.
# https://support.google.com/accounts/answer/185833
server = "smtp.gmail.com"
port = 587                 # 587 = STARTTLS, 465 = implicit TLS
username = "you@gmail.com"
password = "xxxx xxxx xxxx xxxx"
from_address = "you@gmail.com"
from_name = "Your Name"
