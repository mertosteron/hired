[package]
name = "hired"
version = "0.1.0"
edition = "2021"
description = "Terminal bot that scrapes company sites for HR emails and sends a CV via SMTP"

[[bin]]
name = "hired"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "time", "io-util"] }
futures = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
scraper = "0.21"
regex = "1"
once_cell = "1"
url = "2"

lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"

anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
